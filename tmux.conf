# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore the last saved session when the tmux server starts
set -g @continuum-restore 'on'

# Save scrollback/pane output alongside the layout
set -g @resurrect-capture-pane-contents 'on'

# Extra programs to relaunch on restore (added to resurrect's default list).
# A bare name only matches when the saved command line STARTS with it; use a
# leading ~ for programs saved with an absolute path. Check ~/.local/share/
# tmux/resurrect/last to see how a program is actually recorded.
#   claude -> saved as "claude --dangerously-skip-permissions"
#   bun    -> saved as "bun dev"
#   glow   -> saved as "/snap/glow/90/glow -p PLAN.md", so needs ~
set -g @resurrect-processes 'claude bun "~glow"'

# Two same-second saves can leave `last` pointing at a deleted file, which
# makes restore a silent no-op. Repair it at server start (before continuum's
# auto-restore fires) and again after every save.
run-shell '~/.tmux/resurrect-fix-last.sh'
set -g @resurrect-hook-post-save-all '~/.tmux/resurrect-fix-last.sh'

# Prefix C-a (screen-style) frees C-b for vim's page-up. Must come before
# tpm: tmux-sensible reads the prefix at load and adds `prefix a` =
# last-window.
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # C-a C-a sends a literal C-a (vim incr, shell BOL)

# Active vs inactive pane backgrounds
set -g window-style 'bg=colour234'          # inactive panes (dark grey)
set -g window-active-style 'bg=colour232'   # active pane (true black)

# Copy to the system clipboard from vi copy mode, and from the mouse.
#
# Usage: enter copy mode (prefix + [), select text (v), then press y.
# The selection goes to the system clipboard, and tmux leaves copy mode.
# Mouse selections (see the mouse block below) are copied the same way.
#
# How it works:
#   copy-command          the command tmux pipes copied text to whenever
#                         copy-pipe-and-cancel is given none. `y` below
#                         and tmux's default mouse bindings all rely on
#                         that, so this one option covers every copy.
#   clipboard-copy.sh     picks the clipboard tool this machine has:
#                         clip.exe (with iconv to UTF-16LE) on WSL, then
#                         wl-copy, xclip or xsel on plain Linux. See the
#                         script for the order and why.
#   copy-pipe-and-cancel  saves the selection to tmux's paste buffer,
#                         pipes it to copy-command, then exits copy mode.
#
# Why a script and not the pipeline inline: the tool differs per
# machine, and choosing one needs a fallback chain that is hard to read
# in a quoted tmux string. tmux runs the command with `sh -c`, which
# expands the ~ but never loads bash aliases, so a `clip` alias from
# ~/.bashrc would not work here either.
#
# If no tool works, the text still lands in tmux's paste buffer
# (prefix + ]), and tmux also sends it to the terminal as OSC 52, which
# some terminals put on the clipboard.
set -g copy-command '~/.tmux/clipboard-copy.sh'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mouse: a left click on a pane focuses it, and a drag, double-click
# or triple-click selects text in that pane and copies it to the
# system clipboard. Nothing else in tmux reacts to the mouse.
#
# Why: `mouse on` is one switch that also turns on every default mouse
# action (wheel into copy mode, border drag to resize, right-click
# menus, middle-click paste, status-bar clicks). Only focus and
# selection are wanted, so the other actions never fire by accident.
# tmux's selection stays inside one pane, unlike Shift + drag, which
# selects across the whole screen, borders and neighbouring panes too.
#
# How it works:
#   root MouseDown1Pane     tmux's own default: select the pane under
#                           the pointer (-t = is "the pane that was
#                           clicked"), then pass the click on to the
#                           app (send-keys -M).
#   root MouseDrag1Pane     tmux's default: if the app asks for the
#                           mouse (mouse_any_flag), or the pane is
#                           already in copy mode, pass the drag on;
#                           otherwise enter copy mode and start a
#                           selection (copy-mode -M).
#   root DoubleClick1Pane   tmux's defaults for word and line: enter
#   root TripleClick1Pane   copy mode, select, wait 0.3s so the
#                           selection shows, then copy and leave.
#   Copying                 tmux's drag-end and click bindings call
#                           copy-pipe-and-cancel with no command, so
#                           they use copy-command, set with `y` above.
#   unbind -T root ...      removes tmux's other default mouse actions.
#
# The root bindings are spelled out, not left to tmux's defaults, so a
# reload restores them on a server where an older version of this block
# unbound them.
#
# Why not Ctrl-a + click: Claude Code asks for every mouse motion, and
# in tmux 3.4 any motion after the prefix ends the prefix, so the click
# that follows lands in the root table. Motion keys cannot be bound to
# keep the prefix alive (`unknown key: MouseMovePane`).
#
# Apps that ask for the mouse, such as Claude Code, still receive
# events, since tmux forwards unbound mouse events to them. In those
# panes a drag goes to the app, not to tmux; use Shift + drag there.
#
# Gotchas:
#   - tmux now owns the mouse, so a native Windows Terminal selection
#     needs Shift + drag.
#   - The wheel is unbound in the root table, so it does not scroll
#     tmux's history. Once a drag has entered copy mode, the wheel
#     scrolls there (copy-mode tables keep their bindings).
#   - `unbind` lasts for the life of the server. Deleting this block
#     and reloading does not bring the defaults back; restart the
#     server (tmux kill-server) for that.
set -g mouse on
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
bind -T root DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind -T root TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run -d 0.3 ; send-keys -X copy-pipe-and-cancel }
unbind -T root MouseDown1Status
unbind -T root MouseDown2Pane
unbind -T root MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root M-MouseDown3Pane
unbind -T root M-MouseDown3Status
unbind -T root M-MouseDown3StatusLeft
unbind -T root MouseDrag1Border
unbind -T root WheelUpPane
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

# Word boundaries for double-click (and copy mode's w, b, e): a "word"
# runs until whitespace, a quote, a bracket, a pipe, a comma, a
# semicolon or a box-drawing border, so these select whole:
#
#   my-train-case                    slugs and train case
#   ~/tmux-conf/tmux.conf:127        paths, with :line
#   https://host/a?x=1&y=2#frag      URLs, without surrounding ( ) or < >
#   user@example.com  --flag=value   addresses, flags, key=value
#
# Why: tmux's default treats almost all punctuation as a separator,
# including - . / : @, so a double-click on a path or URL picked only
# one piece of it.
#
# The separators: space " ' ` ( ) [ ] { } < > | , ; and │ (U+2502, the
# border glow tables and Claude Code draw, so a table cell selects
# without its borders). ' stays a separator so 'quoted' strings lose
# their quotes, at the cost of splitting contractions such as don't.
#
# Gotchas:
#   - Trailing punctuation comes along: the last word of "see a.conf."
#     selects "a.conf." with the period, and "Error:" keeps its colon.
#   - Copy mode's w, b and e now jump whole paths, like W, B and E.
#   - Claude Code panes are not affected: they handle double-clicks
#     themselves (see the mouse block above).
set -g word-separators " \"'`()[]{}<>|,;│"

# Terminal tab title: "<session>: <current path>", with $HOME shown as ~.
# tmux normally swallows the shell's title escapes, so without this the
# tab keeps whatever title was set before tmux started.
set -g set-titles on
set -g set-titles-string '#S: #{s|^#{HOME}|~|:pane_current_path}'

# Window and pane names that follow the work instead of manual renames.
#
# Claude panes: Claude Code writes a task summary into the pane title
# (e.g. "✳ Fix upload file blank"). The s/// strips the leading glyph and
# =30 caps the length. Other panes: basename of the current directory.
#
# Windows renamed by hand keep their names; renaming turns
# automatic-rename off for that window. Re-enable it inside the window:
#   tmux set -w automatic-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{=30:#{s/^[^ ]+ //:pane_title}},#{b:pane_current_path}}'

# Label each pane on its top border, so split panes and forked Claude
# sessions stay distinguishable. The suffix is the git branch, which
# tells forks apart before their titles diverge. Refreshes every
# status-interval.
#
# The active pane's title sits between two corners, "┐ 0: title ┌", so
# the border line seems to dip around it, and the title is bold. The
# corners take the active border color: cyan, or yellow in copy mode.
# #[default] before the closing corner resets the dim branch style back
# to that border color. Inactive panes show a plain title, with no
# corners and no bold; their leading space keeps the same padding.
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,┐ #[bold], }#{pane_index}: #{?#{==:#{pane_current_command},claude},#{s/^[^ ]+ //:pane_title},#{b:pane_current_path}} #[nobold]#[dim]#(git -C #{pane_current_path} branch --show-current 2>/dev/null) #{?pane_active,#[default]┌,}'

# Cyan theme: dark teal bar, bright cyan for whatever is active.
#
# tmux's defaults use named colors (green, yellow, black), which the
# terminal's palette maps to real shades. In Windows Terminal that put
# dim gray text on bright green, which was hard to read. Hex colors look
# the same whatever the terminal's color scheme.
#
# Only styles are set here, never status-right or status-left, so
# tmux-continuum's autosave trigger is left alone.
set -g status-style "bg=#0b2a33,fg=#a5f3fc"
set -g window-status-style "fg=#5eaab5"
set -g window-status-current-style "bg=#22d3ee,fg=#0b2a33,bold"

# Pad each window name with a space on both sides, so the current
# window's cyan block does not start right at its first character.
# Both formats get the same padding, so names keep their width and the
# list does not shift when switching windows. The trailing space also
# replaces the default format's space for windows without flags.
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '

# The default status-left, "[#S] ", is cut at 10 characters, so a long
# session name like "nvim-config" lost its "] " and ran straight into
# the window list. 30 leaves room for the whole label and its trailing
# space. Only the length changes; status-left itself stays the default.
set -g status-left-length 30

# Pane borders. The active border stays yellow in copy mode and red with
# synchronize-panes, so those states are still visible at a glance. It
# checks pane_mode by name, not pane_in_mode, because the latter is also
# true in the choose-tree view (prefix w), which would turn that
# border yellow too.
set -g pane-border-style "fg=#3b6670"
#
# While the session's terminal window is unfocused (see the focus block
# below), @unfocused is set and the active border fades to the plain
# border color.
set -g pane-active-border-style "#{?@unfocused,fg=#3b6670,#{?#{==:#{pane_mode},copy-mode},fg=yellow,#{?synchronize-panes,fg=red,fg=#22d3ee}}}"

# Selection highlight in choose-tree (prefix w) and copy mode, the
# pane numbers from display-panes (prefix q, also in the tree preview),
# and the message line and command prompt (prefix :).
set -g mode-style "bg=#22d3ee,fg=#0b2a33,bold"
set -g display-panes-colour "#5eaab5"
set -g display-panes-active-colour "#22d3ee"
set -g message-style "bg=#0b2a33,fg=#a5f3fc"
set -g message-command-style "bg=#0b2a33,fg=#22d3ee"

# Dim a terminal window's session while that window is not the focused
# app window, so it is obvious that keys such as Ctrl-a are going to
# another window or app (a browser, say). Each terminal window dims on
# its own: the one in use stays bright, the others fade.
#
# How it works:
#   focus-events on         asks the terminal to report when its window
#                           gains or loses focus (tmux-sensible also sets
#                           it; it is set here so this block does not rely
#                           on it).
#   client-focus-out        dims the client's session through
#                           focus-dim.sh: grey status bar and window list,
#                           lighter pane backgrounds with grey text, and a
#                           faded active border. The active pane stays
#                           darker than the others, so it still stands out.
#   client-focus-in         undims it again.
#   client-attached         undim too: a session attached or switched to
#   client-session-changed  is the one being typed in, even if it was
#                           left dimmed when its last window closed.
#
# The dim is set on the session and its windows, never globally, and the
# undim only unsets it, so the focused colors are the global values above
# and are written nowhere else. focus-dim.sh holds the dimmed colors and
# explains the details.
#
# run-shell without -b keeps each client's hooks in order, so a quick
# out-and-in cannot finish in the wrong order.
#
# Gotchas:
#   - The fg= in the dim affects only text in the terminal's default
#     color. Programs that pick their own colors (Neovim themes, Claude
#     Code, prompts) stay bright; the status bar and borders are the
#     reliable cue.
#   - A window created while its session is dimmed starts bright, until
#     the next focus change.
#   - Reloading the config does not undim a session; focus its window
#     once.
set -g focus-events on
set-hook -g client-focus-out "run-shell \"~/.tmux/focus-dim.sh dim '#{session_id}' '#{client_name}'\""
set-hook -g client-focus-in "run-shell \"~/.tmux/focus-dim.sh undim '#{session_id}' '#{client_name}'\""
set-hook -g client-attached "run-shell \"~/.tmux/focus-dim.sh undim '#{session_id}' '#{client_name}'\""
set-hook -g client-session-changed "run-shell \"~/.tmux/focus-dim.sh undim '#{session_id}' '#{client_name}'\""

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# tmux-continuum appends its autosave trigger to status-right when it loads, so
# a status-right or theme set below this line would silently stop autosaves.
run '~/.tmux/plugins/tpm/tpm'
