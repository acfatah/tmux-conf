# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore the last saved session when the tmux server starts
set -g @continuum-restore 'on'

# Save scrollback/pane output alongside the layout
set -g @resurrect-capture-pane-contents 'on'

# Extra programs to relaunch on restore (added to resurrect's default list).
# A bare name only matches when the saved command line STARTS with it; use a
# leading ~ for programs saved with an absolute path. Check ~/.local/share/
# tmux/resurrect/last to see how a program is actually recorded.
#   claude -> saved as "claude --dangerously-skip-permissions"
#   bun    -> saved as "bun dev"
#   glow   -> saved as "/snap/glow/90/glow -p PLAN.md", so needs ~
set -g @resurrect-processes 'claude bun "~glow"'

# Two same-second saves can leave `last` pointing at a deleted file, which
# makes restore a silent no-op. Repair it at server start (before continuum's
# auto-restore fires) and again after every save.
run-shell '~/.tmux/resurrect-fix-last.sh'
set -g @resurrect-hook-post-save-all '~/.tmux/resurrect-fix-last.sh'

# Prefix C-a (screen-style) frees C-b for vim's page-up. Must come before
# tpm: tmux-sensible reads the prefix at load and adds `prefix a` =
# last-window.
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # C-a C-a sends a literal C-a (vim incr, shell BOL)

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Active vs inactive pane backgrounds
set -g window-style 'bg=colour234'          # inactive panes (dark grey)
set -g window-active-style 'bg=colour232'   # active pane (true black)

# Copy to the Windows clipboard from vi copy mode (WSL).
#
# Usage: enter copy mode (prefix + [), select text (v), then press y.
# The selection goes to the Windows clipboard, and tmux leaves copy mode.
#
# How it works:
#   copy-pipe-and-cancel  saves the selection to tmux's paste buffer,
#                         pipes it to the command below, then exits
#                         copy mode.
#   iconv ... UTF-16LE    clip.exe expects UTF-16LE text. Without this
#                         step, non-ASCII characters (accents, emoji,
#                         box-drawing) come out garbled in Windows.
#   clip.exe              Windows' own clipboard tool. WSL interop runs
#                         it through the Windows PATH, so the .exe
#                         suffix is required.
#
# Why not use the `clip` alias from ~/.bashrc: tmux runs this command
# with `sh -c`, which never loads bash aliases, so the full pipeline has
# to be spelled out here.
#
# If clip.exe is not found (Windows PATH disabled in /etc/wsl.conf),
# use the full path: /mnt/c/Windows/System32/clip.exe
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "iconv -f UTF-8 -t UTF-16LE | clip.exe"

# Terminal tab title: "<session>: <current path>", with $HOME shown as ~.
# tmux normally swallows the shell's title escapes, so without this the
# tab keeps whatever title was set before tmux started.
set -g set-titles on
set -g set-titles-string '#S: #{s|^#{HOME}|~|:pane_current_path}'

# Window and pane names that follow the work instead of manual renames.
#
# Claude panes: Claude Code writes a task summary into the pane title
# (e.g. "✳ Fix upload file blank"). The s/// strips the leading glyph and
# =30 caps the length. Other panes: basename of the current directory.
#
# Windows renamed by hand keep their names; renaming turns
# automatic-rename off for that window. Re-enable it inside the window:
#   tmux set -w automatic-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{=30:#{s/^[^ ]+ //:pane_title}},#{b:pane_current_path}}'

# Label each pane on its top border, so split panes and forked Claude
# sessions stay distinguishable. The dim suffix is the git branch, which
# tells forks apart before their titles diverge. Refreshes every
# status-interval.
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{?#{==:#{pane_current_command},claude},#{s/^[^ ]+ //:pane_title},#{b:pane_current_path}} #[dim]#(git -C #{pane_current_path} branch --show-current 2>/dev/null) '
